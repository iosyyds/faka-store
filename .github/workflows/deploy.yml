name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# Pages 部署需要此权限
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build (static export)
        working-directory: web
        env:
          # 后端 API 地址：在仓库 Settings → Variables 配置 NEXT_PUBLIC_API_BASE，
          # 或直接改下面这行的地址为你的后端域名
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE || 'https://kk.qqqi.top' }}
          # 子路径：绑定自定义域名 qqqi.top 后以根路径部署，这里固定为空字符串；
          # 如需回到 用户名.github.io/仓库名 部署，改为 /faka-store
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '' }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # next export 的输出目录
          path: ./web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
